    const center = data.find(d => d.name.includes("大兴城") || d.name.includes("唐长安")) || data.find(d => d.name.includes("西安")) || anchor;
    const cx = x(center.lon), cy = y(center.lat);
    const maxR = Math.max(210, Math.min(cx - x0, x0 + w - cx, cy - y0, y0 + h - cy) - 22);
    add(bagua, "circle", {cx, cy, r:maxR, fill:"rgba(217,72,15,0.035)", stroke:"rgba(217,72,15,0.62)", "stroke-width":2.2});
    add(bagua, "circle", {cx, cy, r:maxR * 0.62, fill:"none", stroke:"rgba(217,72,15,0.24)", "stroke-width":1.1, "stroke-dasharray":"5 5"});
    const oct = [];
    for (let i=0; i<8; i++) {
      const a = -Math.PI/2 + i * Math.PI/4;
      oct.push([cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR]);
    }
    add(bagua, "path", {d:"M" + oct.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z", fill:"none", stroke:"rgba(217,72,15,0.45)", "stroke-width":1.8});
    for (let i=0; i<8; i++) {
      const a = -Math.PI/2 + i * Math.PI/4;
      add(bagua, "line", {x1:cx, y1:cy, x2:cx + Math.cos(a)*maxR, y2:cy + Math.sin(a)*maxR, stroke:"rgba(217,72,15,0.22)", "stroke-width":1.1});
    }
    const trigrams = ["☰","☱","☲","☳","☷","☶","☵","☴"];
    const names = ["乾","兑","离","震","坤","艮","坎","巽"];
    trigrams.forEach((symbol, i) => {
      const a = -Math.PI/2 + i * Math.PI/4;
      const tx = cx + Math.cos(a) * (maxR - 16);
      const ty = cy + Math.sin(a) * (maxR - 16);
      const t = add(bagua, "text", {x:tx, y:ty, "text-anchor":"middle", class:"bagua-label"});
      t.textContent = symbol + names[i];
    });
    const c = add(bagua, "text", {x:cx, y:cy + 4, "text-anchor":"middle", class:"bagua-center"});
    c.textContent = "西安";
  }
  function shortName(name) { return name.split("、")[0].replace("遗址","").replace("古城","").replace("府",""); }
  const categoryText = {capital:"都城/全国中心", city:"区域城市", town:"古镇/关隘/驿站", ruin:"考古遗址/湮灭城址"};
  function selectPlace(d) { const box=root.querySelector("#place-detail-104"); box.querySelector(".detail-title").textContent=d.name; box.querySelector(".detail-meta").textContent=`${d.admin} · ${d.type} · ${d.lat.toFixed(5)}, ${d.lon.toFixed(5)} · ${d.scale} · ${d.era} · 距西安参照点约 ${Math.round(d.dist)} km · ${categoryText[d.category]}`; box.querySelector(".detail-history").textContent=(d.historicalCulture ? "🌟 国家历史文化名城标识。 " : "") + (d.history || "暂无补充说明。"); root.querySelectorAll(".place-marker").forEach(g=>g.removeAttribute("data-selected")); const active=root.querySelector(`[data-name="${CSS.escape(d.name)}"]`); if (active) active.setAttribute("data-selected","true"); }
  function starPath(cx, cy, outer=4.6, inner=2.1) {
    const pts=[];
    for (let i=0;i<10;i++) {
      const a=-Math.PI/2+i*Math.PI/5, r=i%2?inner:outer;
      pts.push((cx+Math.cos(a)*r).toFixed(1) + "," + (cy+Math.sin(a)*r).toFixed(1));
    }
    return "M"+pts.join("L")+"Z";
  }
  function drawPoints() {
    const pts=root.querySelector("#points104");
    const defs=add(svg,"defs",{});
    defs.innerHTML='<marker id="major-arrow-104" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff"></path></marker>';
    data.forEach(d=>{
      const g=add(pts,"g",{class:"place-marker","data-name":d.name});
      const px=x(d.lon),py=y(d.lat),stroke=d.dist<=r90+0.001?"rgba(47,125,93,0.95)":"var(--outside)";
      const core=coreNames.has(d.name);
      const scale=core?1:0.62;
      add(g,"circle",{cx:px,cy:py,r:12,fill:"transparent"});
      if (d.category==='capital') {
        const size=10.5*scale;
        add(g,"path",{d:"M "+px+" "+(py-size)+" L "+(px+size*0.9)+" "+(py+size*0.75)+" L "+(px-size*0.9)+" "+(py+size*0.75)+" Z",fill:"var(--capital)",stroke:d.anchor?"white":stroke,"stroke-width":(d.anchor?2.4:1.45)*scale});
      } else if (d.category==='city') {
        const size=9*scale;
        add(g,"rect",{x:px-size/2,y:py-size/2,width:size,height:size,fill:"var(--regional)",stroke:stroke,"stroke-width":1.35*scale});
      } else if (d.category==='town') {
        add(g,"circle",{cx:px,cy:py,r:6.8*scale,fill:"var(--town)",stroke:stroke,"stroke-width":1.35*scale});
      } else {
        add(g,"circle",{cx:px,cy:py,r:5.8*scale,fill:"var(--ruin)",stroke:stroke,"stroke-width":1.35*scale});
      }
      if (d.historicalCulture) {
        add(g,"path",{d:starPath(px+6.2*scale, py-7.4*scale, 4.7*scale, 2.05*scale), fill:"#d9480f", stroke:"#fff", "stroke-width":0.75});
      }
      g.addEventListener("click",()=>selectPlace(d));
      if (majorLabels.has(d.name)) {
        add(pts,"line",{x1:px+26,y1:py-18,x2:px+3,y2:py-3,stroke:"#fff","stroke-width":1.9,"stroke-linecap":"round","marker-end":"url(#major-arrow-104)"});
        const t=add(pts,"text",{x:px+28,y:py-19,class:"map-label"});
        t.textContent=shortName(d.name);
      }
    });
  }
  const style=document.createElement("style"); style.textContent=`#ancient-town-gis-142 .place-marker[data-selected="true"] path, #ancient-town-gis-142 .place-marker[data-selected="true"] circle:not(:first-child) { stroke:#ffd166; stroke-width:3.4px; }`; root.appendChild(style);
  drawSatellite(); drawTerrain(); drawGrid(); drawBagua(); drawPoints(); selectPlace(anchor);
})();
</script></body>
